<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PulseFit Health Platform</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/" class="brand">
      <i class="fa-solid fa-bolt-lightning"></i> PulseFit
    </a>
    <nav class="nav-links">
      <a href="/register.html" class="btn btn-outline"><i class="fa-solid fa-user-plus"></i> Register</a>
    </nav>
  </header>

  <!-- Login Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="card-icon" style="margin: 0 auto 1rem auto;">
          <i class="fa-solid fa-right-to-bracket"></i>
        </div>
        <h2>Welcome Back</h2>
        <p>Log in to access your workouts, diet plan, and daily streaks</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer;">
              <i class="fa-solid fa-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.85rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to PulseFit
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create one now</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    // Password visibility toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleIcon.className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
    });

    // Check if redirected from expired session
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired')) {
      showToast('Your session has expired. Please sign in again.', 'info');
    }

    // Handle Login submission
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      try {
        const response = await apiFetch('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        if (response.success && response.data) {
          setAuth(response.data.token, response.data.user);
          showToast('Welcome back, ' + response.data.user.fullName + '!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } else {
          showToast(response.message || 'Login failed', 'error');
        }
      } catch (err) {
        showToast(err.message || 'Invalid credentials', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to PulseFit';
      }
    });
  </script>
</body>
</html>
