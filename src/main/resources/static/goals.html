<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals & Milestones — PulseFit</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .goals-container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .goals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .filter-pills {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .filter-pill {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .goal-card {
      background: var(--glass);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: all 0.2s ease;
    }

    .goal-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .goal-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .goal-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 90%;
      max-width: 520px;
      padding: 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <a href="/dashboard.html" class="brand">
      <i class="fa-solid fa-bolt-lightning"></i> PulseFit
    </a>
    <nav class="nav-links">
      <a href="/dashboard.html" class="btn btn-outline"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/workout.html" class="btn btn-outline"><i class="fa-solid fa-dumbbell"></i> Workout</a>
      <a href="/diet.html" class="btn btn-outline"><i class="fa-solid fa-bowl-food"></i> Diet</a>
      <a href="/water.html" class="btn btn-outline"><i class="fa-solid fa-glass-water"></i> Water</a>
      <a href="/progress.html" class="btn btn-outline"><i class="fa-solid fa-chart-line"></i> Progress</a>
      <a href="/goals.html" class="btn btn-primary"><i class="fa-solid fa-bullseye"></i> Goals</a>
      <a href="/profile.html" class="btn btn-outline"><i class="fa-solid fa-user"></i> Profile</a>
      <button onclick="logout()" class="btn btn-outline" style="color: #f87171;"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
    </nav>
  </header>

  <main class="goals-container">

    <div class="goals-header">
      <div>
        <h1 style="font-size: 2rem; font-weight: 800;"><i class="fa-solid fa-bullseye" style="color: #fbbf24;"></i> Goals & Milestones</h1>
        <p style="color: var(--text-muted); margin-top: 0.25rem;">Set ambitious health targets, track incremental steps, and celebrate victories</p>
      </div>
      <div>
        <button onclick="openCreateModal()" class="btn btn-primary">
          <i class="fa-solid fa-plus"></i> Set New Goal
        </button>
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filter-pills">
      <div class="filter-pill active" onclick="setFilter('ALL', this)">All Goals</div>
      <div class="filter-pill" onclick="setFilter('IN_PROGRESS', this)">In Progress</div>
      <div class="filter-pill" onclick="setFilter('ACHIEVED', this)">Achieved 🏆</div>
    </div>

    <!-- Goals Grid Container -->
    <div class="goals-grid" id="goalsGrid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--text-muted);">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 1rem;"></i>
        <p>Loading your milestones...</p>
      </div>
    </div>

  </main>

  <!-- Create Goal Modal -->
  <div class="modal-backdrop" id="createModal">
    <div class="modal-dialog">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 style="font-weight: 700; font-size: 1.25rem;">Create New Milestone</h3>
        <button onclick="closeCreateModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleCreateGoal(event)">
        <div class="form-group">
          <label for="goalTitle">Goal Title</label>
          <input type="text" id="goalTitle" class="form-control" placeholder="e.g. Reach 68kg Body Weight" required>
        </div>

        <div class="form-group">
          <label for="goalType">Goal Category</label>
          <select id="goalType" class="form-control" required>
            <option value="TARGET_WEIGHT">Target Weight (kg)</option>
            <option value="WORKOUT_STREAK">Workout Streak (days)</option>
            <option value="TOTAL_WORKOUTS">Total Workouts Completed</option>
            <option value="DAILY_CALORIES">Daily Calorie Target (kcal)</option>
            <option value="WATER_INTAKE">Daily Water Intake (ml)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startValue">Start Value</label>
            <input type="number" step="0.1" id="startValue" class="form-control" placeholder="e.g. 75" required>
          </div>
          <div class="form-group">
            <label for="targetValue">Target Value</label>
            <input type="number" step="0.1" id="targetValue" class="form-control" placeholder="e.g. 68" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="currentValue">Current Value (Optional)</label>
            <input type="number" step="0.1" id="currentValue" class="form-control" placeholder="Defaults to start value">
          </div>
          <div class="form-group">
            <label for="targetDate">Target Completion Date</label>
            <input type="date" id="targetDate" class="form-control">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" onclick="closeCreateModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary" id="createGoalBtn"><i class="fa-solid fa-check"></i> Create Goal</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Update Goal Progress Modal -->
  <div class="modal-backdrop" id="updateModal">
    <div class="modal-dialog">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
        <h3 style="font-weight: 700; font-size: 1.25rem;">Update Milestone Progress</h3>
        <button onclick="closeUpdateModal()" style="background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer;">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleUpdateGoal(event)">
        <input type="hidden" id="editGoalId">
        <div class="form-group">
          <label id="editGoalTitleDisplay" style="font-weight: 700; color: #818cf8;"></label>
        </div>

        <div class="form-group">
          <label for="editCurrentValue">New Current Value</label>
          <input type="number" step="0.1" id="editCurrentValue" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editStatus">Status</label>
          <select id="editStatus" class="form-control">
            <option value="IN_PROGRESS">In Progress ⏳</option>
            <option value="ACHIEVED">Achieved 🏆</option>
            <option value="ABANDONED">Paused / Abandoned ❌</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" onclick="closeUpdateModal()" class="btn btn-outline">Cancel</button>
          <button type="submit" class="btn btn-primary" id="updateGoalBtn"><i class="fa-solid fa-floppy-disk"></i> Save Progress</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let allGoals = [];
    let currentFilter = 'ALL';

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isAuthenticated()) {
        window.location.href = '/login.html';
        return;
      }
      await loadGoals();
    });

    async function loadGoals() {
      try {
        const res = await apiFetch('/api/goals');
        if (!res.success) throw new Error(res.message);

        allGoals = res.data || [];
        renderGoals();
      } catch (err) {
        showToast(err.message || 'Error loading goals', 'error');
      }
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderGoals();
    }

    function renderGoals() {
      const container = document.getElementById('goalsGrid');
      const filtered = allGoals.filter(g => {
        if (currentFilter === 'ALL') return true;
        return g.status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; background: var(--glass); border-radius: var(--radius); border: 1px dashed var(--border-color);">
            <i class="fa-solid fa-flag-checkered" style="font-size: 2.5rem; color: #fbbf24; margin-bottom: 1rem;"></i>
            <h3 style="font-size: 1.2rem; font-weight: 700;">No goals found</h3>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin: 0.5rem 0 1.5rem 0;">Ready to conquer new heights? Set your milestone today!</p>
            <button onclick="openCreateModal()" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Set New Goal</button>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(goal => {
        const isAchieved = goal.status === 'ACHIEVED';
        const percent = Math.min(100, Math.round(goal.progressPercentage || 0));

        let icon = 'fa-bullseye';
        let iconBg = 'rgba(245, 158, 11, 0.15)';
        let iconCol = '#fbbf24';

        if (goal.goalType === 'TARGET_WEIGHT') {
          icon = 'fa-weight-scale';
          iconBg = 'rgba(16, 185, 129, 0.15)';
          iconCol = '#10b981';
        } else if (goal.goalType === 'WORKOUT_STREAK') {
          icon = 'fa-fire';
          iconBg = 'rgba(239, 68, 68, 0.15)';
          iconCol = '#f87171';
        } else if (goal.goalType === 'TOTAL_WORKOUTS') {
          icon = 'fa-dumbbell';
          iconBg = 'rgba(99, 102, 241, 0.15)';
          iconCol = '#818cf8';
        } else if (goal.goalType === 'WATER_INTAKE') {
          icon = 'fa-glass-water';
          iconBg = 'rgba(6, 182, 212, 0.15)';
          iconCol = '#06b6d4';
        }

        html += `
          <div class="goal-card">
            <div>
              <div class="goal-top">
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                  <div class="goal-icon" style="background: ${iconBg}; color: ${iconCol};">
                    <i class="fa-solid ${icon}"></i>
                  </div>
                  <div>
                    <h4 style="font-weight: 700; font-size: 1.05rem; color: #ffffff;">${goal.title}</h4>
                    <span style="font-size: 0.78rem; color: var(--text-muted);">${goal.goalTypeDisplay || 'Milestone'}</span>
                  </div>
                </div>
                <span class="badge" style="background: ${isAchieved ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.15)'}; color: ${isAchieved ? '#10b981' : '#fbbf24'};">
                  ${isAchieved ? '<i class="fa-solid fa-trophy"></i> Achieved' : 'In Progress'}
                </span>
              </div>

              <!-- Values & Progress -->
              <div style="margin: 1.25rem 0 0.5rem 0;">
                <div style="display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 0.4rem;">
                  <span style="color: var(--text-muted);">Current: <b style="color: #fff;">${goal.currentValue}</b></span>
                  <span style="color: var(--text-muted);">Target: <b style="color: #fff;">${goal.targetValue}</b></span>
                </div>
                <div class="progress-bar-bg" style="height: 10px;">
                  <div class="progress-bar-fill" style="width: ${percent}%; background: ${isAchieved ? '#10b981' : 'linear-gradient(90deg, #6366f1, #06b6d4)'};"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.35rem;">
                  <span>Start: ${goal.startValue}</span>
                  <span style="font-weight: 700; color: ${isAchieved ? '#10b981' : '#818cf8'};">${percent}% Complete</span>
                </div>
              </div>

              ${goal.targetDate ? `<div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 0.5rem;"><i class="fa-regular fa-calendar" style="margin-right: 0.3rem;"></i> Due: ${goal.targetDate}</div>` : ''}
            </div>

            <!-- Action buttons -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(255, 255, 255, 0.05);">
              <button onclick="openUpdateModal(${goal.id}, '${escapeQuotes(goal.title)}', ${goal.currentValue}, '${goal.status}')" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.82rem;">
                <i class="fa-solid fa-pen-to-square"></i> Update
              </button>
              <button onclick="deleteGoal(${goal.id})" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.82rem; color: #f87171; border-color: rgba(239, 68, 68, 0.2);">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function escapeQuotes(str) {
      return (str || '').replace(/'/g, "\\'");
    }

    function openCreateModal() {
      document.getElementById('createModal').classList.add('open');
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('open');
    }

    function openUpdateModal(id, title, currentValue, status) {
      document.getElementById('editGoalId').value = id;
      document.getElementById('editGoalTitleDisplay').textContent = title;
      document.getElementById('editCurrentValue').value = currentValue;
      document.getElementById('editStatus').value = status;
      document.getElementById('updateModal').classList.add('open');
    }

    function closeUpdateModal() {
      document.getElementById('updateModal').classList.remove('open');
    }

    async function handleCreateGoal(e) {
      e.preventDefault();
      const btn = document.getElementById('createGoalBtn');
      btn.disabled = true;

      const payload = {
        title: document.getElementById('goalTitle').value,
        goalType: document.getElementById('goalType').value,
        startValue: parseFloat(document.getElementById('startValue').value),
        targetValue: parseFloat(document.getElementById('targetValue').value),
        currentValue: document.getElementById('currentValue').value ? parseFloat(document.getElementById('currentValue').value) : null,
        targetDate: document.getElementById('targetDate').value || null
      };

      try {
        const res = await apiFetch('/api/goals', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        if (!res.success) throw new Error(res.message);

        showToast('Milestone created! Go crush it! 🏆', 'success');
        closeCreateModal();
        await loadGoals();
      } catch (err) {
        showToast(err.message || 'Error creating goal', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function handleUpdateGoal(e) {
      e.preventDefault();
      const id = document.getElementById('editGoalId').value;
      const btn = document.getElementById('updateGoalBtn');
      btn.disabled = true;

      const payload = {
        currentValue: parseFloat(document.getElementById('editCurrentValue').value),
        status: document.getElementById('editStatus').value
      };

      try {
        const res = await apiFetch(`/api/goals/${id}`, {
          method: 'PATCH',
          body: JSON.stringify(payload)
        });
        if (!res.success) throw new Error(res.message);

        showToast('Goal progress updated!', 'success');
        closeUpdateModal();
        await loadGoals();
      } catch (err) {
        showToast(err.message || 'Error updating goal', 'error');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteGoal(id) {
      if (!confirm('Are you sure you want to delete this goal?')) return;

      try {
        const res = await apiFetch(`/api/goals/${id}`, {
          method: 'DELETE'
        });
        if (!res.success) throw new Error(res.message);

        showToast('Goal deleted.', 'info');
        await loadGoals();
      } catch (err) {
        showToast(err.message || 'Error deleting goal', 'error');
      }
    }
  </script>
</body>
</html>
